[Scope]
# PID 1 and the platform-injected SSH listener live here. Reserve control-plane
# responsiveness and prevent an unregistered SSH/SFTP fan-out from exhausting
# the VM before the login wrapper can hand normal commands to user.slice.
CPUWeight=1000
IOWeight=1000
MemoryLow=10%
TasksMax=512
