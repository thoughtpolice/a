[Scope]
# PID 1 and the platform's SSH listener live here. Keep them responsive,
# and cap the tasks an SSH or SFTP fan-out can create here before the
# login wrapper moves commands into user.slice.
CPUWeight=1000
IOWeight=1000
MemoryLow=10%
TasksMax=512
