#
# Installed as a drop-in for each vendor unit in NO_CREDENTIAL_UNITS in
# ../../BUILD. The vendor unit imports credentials, and this takes them
# away.
#
# ImportCredential= reads the credential store directories and the
# credentials PID 1 collected at boot from the kernel command line, SMBIOS
# and fw_cfg. A tmpfiles.extra or sysctl.extra from any of those would be
# applied as root, next to the image's own sealed tmpfiles.d and sysctl.d,
# by configuration that no layer ships and no boot smoke sees. The policy
# seals the credstore directories against compositions. This covers what
# arrives from outside the image.

[Service]
ImportCredential=
