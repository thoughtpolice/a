[Service]
# user.slice holds the aggregate ceiling. Below it, a runtime or build
# tool can split its own scope across every controller the exe.dev kernel
# offers, but can't raise the ceiling above it. OOMPolicy=continue keeps
# the user manager alive when the kernel kills one of its processes.
Delegate=cpu cpuset io memory pids
OOMPolicy=continue
OOMScoreAdjust=-100
TasksMax=3072
TimeoutStopSec=30s
