#
# minimos ships no PAM, with no libpam and /etc/pam.d culled, so the
# vendor PAMName=systemd-user would make every user@ instance fail at
# exec. With it reset, systemd starts `systemd --user` directly, the same
# as upstream's build without PAM support. pam_systemd used to set
# XDG_RUNTIME_DIR, so it's set by hand. Nothing else is lost, because
# PAM's job here is registering login sessions with logind, and the
# platform sshd never talks to logind.
#
# A user manager only runs for an account that lingers, as exedev does in
# examples/dev. The configuration lives in the base anyway, because the
# composition policy refuses drop-ins for base units from higher layers.

[Service]
PAMName=
Environment=XDG_RUNTIME_DIR=/run/user/%i
