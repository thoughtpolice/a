[Manager]
LogLevel=info
# The image Cmd passes --log-target=syslog, which wins over this. console
# only applies if a composition replaces the Cmd.
LogTarget=console
SystemCallArchitectures=native
# CPU accounting is always on in the unified hierarchy, and systemd 261
# removed the switch for it.
DefaultIOAccounting=yes
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes
# Stop the whole service when the kernel OOM-kills one of its processes,
# since a service missing a process is usually worse than a restart.
# user@.service overrides this with continue.
DefaultOOMPolicy=kill
DefaultTasksMax=1024
# systemd-coredump is culled, so nothing collects core dumps. Don't let
# PID 1 or any service write one either.
DumpCore=no
DefaultLimitCORE=0
# A burst of Ctrl-Alt-Del on the console must not reboot the VM.
CtrlAltDelBurstAction=none
# Don't let one stuck service hold a shutdown for 90 seconds.
DefaultTimeoutStopSec=15s
