[Manager]
LogLevel=info
LogTarget=console
SystemCallArchitectures=native
# CPU accounting is unconditional in the unified cgroup hierarchy used by the
# pinned systemd; its former switch was removed in systemd 261.
DefaultIOAccounting=yes
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes
# A partial multiprocess service is generally less reliable than a clean
# restart. Delegated container/user managers override this to continue.
DefaultOOMPolicy=kill
DefaultTasksMax=1024
# No coredump machinery ships (systemd-coredump is culled): don't
# process crashes, don't let services write core files either.
DumpCore=no
DefaultLimitCORE=0
# A console Ctrl-Alt-Del burst must not reboot a VM out from under its
# platform.
CtrlAltDelBurstAction=none
# Appliance shutdowns shouldn't hang 90s on a stuck service.
DefaultTimeoutStopSec=15s
