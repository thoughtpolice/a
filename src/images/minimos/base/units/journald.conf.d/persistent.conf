[Journal]
Storage=persistent
# Cap the persistent journal so a chatty service can't eat the disk.
SystemMaxUse=64M
SystemKeepFree=128M
RuntimeMaxUse=32M
MaxRetentionSec=7day
RateLimitIntervalSec=30s
RateLimitBurst=5000
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToWall=no
