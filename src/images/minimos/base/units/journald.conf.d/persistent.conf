[Journal]
Storage=persistent
# Keep the journal across reboots, since it is the main way to debug a
# VM with no shell tools, and cap it so a chatty service can't fill the
# disk.
SystemMaxUse=64M
SystemKeepFree=128M
RuntimeMaxUse=32M
MaxRetentionSec=7day
RateLimitIntervalSec=30s
RateLimitBurst=5000
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToWall=no
