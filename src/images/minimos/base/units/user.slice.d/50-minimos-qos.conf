[Slice]
# Interactive builds and sandboxes can burst, but can't eat the memory
# reserved for init.scope and system.slice or create unbounded tasks.
CPUWeight=100
# IOWeight= only works where the block scheduler exposes io.weight, and
# exe.dev's virtio disk doesn't. The io.max ceilings below work anyway,
# because systemd resolves "/" to its backing device.
IOWeight=100
IOReadBandwidthMax=/ 500M
IOWriteBandwidthMax=/ 250M
IOReadIOPSMax=/ 50K
IOWriteIOPSMax=/ 25K
MemoryHigh=70%
MemoryMax=80%
MemorySwapMax=0
TasksMax=3072
