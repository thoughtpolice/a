[Slice]
# Interactive builds and same-owner sandboxes may burst, but cannot consume the
# final control-plane reserve or create an unbounded number of tasks.
CPUWeight=100
# Proportional I/O weight is used when the backing scheduler exposes
# io.weight. The aggregate hard ceilings remain effective on exe.dev's current
# weightless virtio stack because systemd resolves "/" to its backing device
# and programs io.max.
IOWeight=100
IOReadBandwidthMax=/ 500M
IOWriteBandwidthMax=/ 250M
IOReadIOPSMax=/ 50K
IOWriteIOPSMax=/ 25K
MemoryHigh=70%
MemoryMax=80%
MemorySwapMax=0
TasksMax=3072
