#
# The base links systemd-growfs-root.service into local-fs.target so the
# root ext4 grows to fill its disk at the next boot after
# `ssh exe.dev resize`. A new VM's filesystem already fills its disk, and
# there the grow is a no-op.
#
# Under docker the root is an overlay with no block device behind it, so
# systemd-growfs would fail and take the boot smoke down with it.

[Unit]
ConditionVirtualization=!container
