[Unit]
# systemd's user-.slice.d/10-defaults.conf matches this slice's name and
# describes it as "User Slice of UID workload". Put the real description
# back. Its StopWhenUnneeded=yes stays.
Description=Bounded minimos application workloads
Documentation=

[Slice]
# Loaded after 10-defaults.conf, so this wins over its TasksMax=33%.
# The boot smoke checks the value systemd ends up with.
TasksMax=2048
