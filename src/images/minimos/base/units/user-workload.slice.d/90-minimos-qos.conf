[Unit]
# The generic vendor user-.slice drop-in also supplies UID-oriented metadata.
# Restore the actual operator-facing identity while retaining its useful
# StopWhenUnneeded behavior.
Description=Bounded minimos application workloads
Documentation=

[Slice]
# user-workload.slice also inherits the vendor user-.slice.d drop-ins.
# Reassert the security ceiling after those generic defaults are loaded.
TasksMax=2048
