[Manager]
# A user manager has its own defaults; it does not inherit these settings from
# system.conf. Keep user-created services observable and bounded even when they
# are not launched through the SSH login wrapper.
DefaultIOAccounting=yes
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes
DefaultTasksMax=2048
DefaultOOMPolicy=kill
DefaultTimeoutStopSec=30s
DumpCore=no
DefaultLimitCORE=0
