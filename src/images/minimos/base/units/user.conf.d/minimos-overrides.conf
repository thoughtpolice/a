[Manager]
# A user manager doesn't inherit system.conf, so it gets the same
# accounting and limits here. This covers user services that don't come
# through the SSH login wrapper.
DefaultIOAccounting=yes
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes
DefaultTasksMax=2048
DefaultOOMPolicy=kill
DefaultTimeoutStopSec=30s
DumpCore=no
DefaultLimitCORE=0
