# Every local uid can reach the bus, and Wolfi's dbus.service carries no
# sandbox at all, just User=, Group= and AmbientCapabilities=. journald
# and logind ship upstream hardening already. This is the block the
# example services use, trimmed to what dbus-daemon needs. It reads
# policy from /usr/share/dbus-1 and /etc/dbus-1, writes only its runtime
# directory, and speaks AF_UNIX.
#
# No DynamicUser=, because the vendor policy files name the baked
# messagebus account.

[Service]
NoNewPrivileges=yes
# The vendor unit grants CAP_AUDIT_WRITE as an ambient capability for
# audit records. Bound the set to that one.
CapabilityBoundingSet=CAP_AUDIT_WRITE
RestrictAddressFamilies=AF_UNIX
RuntimeDirectory=dbus
RuntimeDirectoryPreserve=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateIPC=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=077
