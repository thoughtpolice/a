# The bus broker is the one always-on service in the base that every local uid
# can reach, and the only one whose vendor unit carries no sandbox at all
# (journald and logind ship upstream hardening blocks; Wolfi's dbus.service is
# User=/Group=/AmbientCapabilities= and nothing else). This is the same block
# the README asks composed services to copy, trimmed to what dbus-daemon
# demonstrably needs: it reads its policy out of /usr/share/dbus-1 and
# /etc/dbus-1, writes only its RuntimeDirectory, and speaks AF_UNIX.
#
# DynamicUser= is deliberately not used: the messagebus uid is baked into
# /etc/passwd and named by the vendor policy files.

[Service]
NoNewPrivileges=yes
# CAP_AUDIT_WRITE is the one capability the vendor unit grants (ambient, for
# audit records); bound the set to exactly it so nothing else is reachable.
CapabilityBoundingSet=CAP_AUDIT_WRITE
RestrictAddressFamilies=AF_UNIX
RuntimeDirectory=dbus
RuntimeDirectoryPreserve=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateIPC=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=077
