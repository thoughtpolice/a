#
# exe-setup.service runs `systemd-tmpfiles --remove <this file>` after the
# setup script. It lives outside tmpfiles.d because the boot-time
# `systemd-tmpfiles --create --remove` pass would delete the script
# before it ran.
r /exe.dev/setup
