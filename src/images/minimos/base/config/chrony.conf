#
# chronyd's only time source is /dev/ptp0, the KVM virtual PTP clock
# every exe.dev VM has. It reads the host's clock through a hypercall, so
# there's no network path to estimate and no remote party to
# authenticate. The alternative would be plain NTP over UDP, because
# Wolfi builds chrony without NTS (`-NTS` in its feature line), and a
# forged time makes expired certificates and tokens look valid.
#
# So there are no `server` or `pool` lines, and chronyd.service runs with
# PrivateNetwork=yes to keep it that way.

# poll 3 and dpoll -2 are the usual KVM PTP settings. chronyd reads the
# device four times a second and adjusts the system clock every eight
# seconds. The device reads the host clock directly, so no offset applies.
refclock PHC /dev/ptp0 poll 3 dpoll -2 offset 0

# Step the clock whenever it is more than a second off, for the VM's whole
# life. A guest that was paused, migrated or restored from a snapshot can
# come back far behind, and slewing back takes hours of wrong timestamps.
# Stepping is safe because the source is local.
makestep 1.0 -1

# Log when the clock moves by more than half a second. Without this the
# journal says nothing whether chronyd works or not.
logchange 0.5

driftfile /var/lib/chrony/drift

# No listeners. `port 0` serves no NTP, `cmdport 0` drops the UDP command
# port, and `bindcmdaddress /` removes the unix command socket too. That
# socket can set the clock, and the image ships no chronyc to use it.
port 0
cmdport 0
bindcmdaddress /

# No `rtcsync`. exe.dev VMs have no RTC (`timedatectl` reports "RTC
# time: n/a"), so the kernel's 11-minute mode has nothing to write to.
