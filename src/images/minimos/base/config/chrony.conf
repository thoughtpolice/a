#
# /etc/chrony/chrony.conf — one source, and it is not the network.
#
# exe.dev VMs expose /dev/ptp0, the KVM virtual PTP clock: a paravirtual
# device that reads the host's clock through a hypercall. As a time
# source it beats the alternative on both axes. Accuracy: no network
# path, no round-trip estimation, sub-microsecond agreement with the
# machine this VM is actually running on. Trust: it is reachable only
# from inside the hypervisor, so there is no off-box party to
# authenticate — which matters here, because Wolfi builds chrony without
# NTS (`-NTS` in its feature line). Network time would therefore be
# unauthenticated UDP, and a lie about the time is a lie about
# certificate expiry, log ordering, and token lifetimes.
#
# So there are no `server` or `pool` lines, and the unit backs that with
# PrivateNetwork=yes. A composition that genuinely needs network time can
# drop in its own `sourcedir` and lift that restriction — see the
# chronyd.service.d note in the image README.

# The hypervisor clock. poll 3 / dpoll -2 is the documented KVM-PTP
# cadence: sample the device four times a second, discipline the system
# clock every eight. The device is exact by construction, so no offset
# correction is applied.
refclock PHC /dev/ptp0 poll 3 dpoll -2 offset 0

# Step rather than slew, at any point in the VM's life, not just the
# first few updates: a guest that was paused, migrated, or restored from
# a snapshot can come back arbitrarily far behind, and slewing back from
# there takes hours during which every timestamp is wrong. The source
# being local is what makes stepping safe.
makestep 1.0 -1

# Say something in the journal when the clock actually moves. Without
# this the service is silent whether it is working or not.
logchange 0.5

driftfile /var/lib/chrony/drift

# No listeners at all. `port 0` refuses to serve NTP; `cmdport 0` drops
# the UDP command ports; `bindcmdaddress /` removes even the unix command
# socket, which is not a nicety — that socket can set the clock, and this
# image ships no chronyc that could legitimately use it.
port 0
cmdport 0
bindcmdaddress /

# Deliberately no `rtcsync`: the platform gives these VMs no RTC
# (`timedatectl` reports "RTC time: n/a"), so the kernel's 11-minute mode
# would have nothing to write back to.
