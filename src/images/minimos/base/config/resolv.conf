#
# exe.dev VMs get their interface config from the kernel ip= cmdline
# parameter, which carries no DNS servers, and minimos runs no
# resolved/networkd to learn any — without this file glibc falls back
# to querying localhost and all name resolution fails. The stock
# exe.dev image uses the same public resolver. Platform-internal names
# (e.g. *.int.exe.xyz) are published in public DNS, so one upstream
# covers those too.
nameserver 1.1.1.1
