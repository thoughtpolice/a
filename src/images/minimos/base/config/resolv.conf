#
# exe.dev rewrites this file at boot to use its own resolver,
# 169.254.169.254, the DNS server the kernel ip= parameter names. This
# copy is what the image uses under docker, or if the platform ever stops
# writing the file, since minimos runs no resolved or networkd and glibc
# would otherwise ask localhost. Platform names such as *.int.exe.xyz
# are in public DNS, so a public resolver finds them too.
nameserver 1.1.1.1
