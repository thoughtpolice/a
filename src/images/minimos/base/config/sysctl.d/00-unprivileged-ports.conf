#
# Restore the kernel security boundary even if the platform image default
# widens it. Services which genuinely need a low port receive only
# CAP_NET_BIND_SERVICE in their systemd unit; unrelated user/container
# workloads cannot race the service or impersonate a privileged listener.
net.ipv4.ip_unprivileged_port_start = 1024
