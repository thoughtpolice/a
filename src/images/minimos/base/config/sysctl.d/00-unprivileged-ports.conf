#
# Put the kernel's default back. The stock exe.dev image lets any user
# bind ports below 1024. On minimos a service that needs a low port gets
# CAP_NET_BIND_SERVICE in its own unit, so other workloads can't grab
# the port first or pose as a privileged listener.
net.ipv4.ip_unprivileged_port_start = 1024
