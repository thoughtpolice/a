#
# Hardening that is safe anywhere, because every key here is scoped to a
# network namespace. Under docker the boot smoke shares the host's kernel,
# so host-global fs.*, dev.*, user.*, kernel.* and vm.* keys live in
# /usr/lib/minimos/sysctl-vm.conf, which only minimos-harden.service
# applies, and only on a VM.
#
# The base denies systemd's 50-default.conf because it mixes host-global
# keys into the automatic search path. Its network half is restated here
# as upstream wrote it, and its global half moved to sysctl-vm.conf.
#
# Two upstream settings are left out. net.ipv4.ping_group_range exists
# for unprivileged ping, and no image ships ping. net.core.default_qdisc
# tunes bufferbloat and doesn't need to be set here.

# Source route verification, and no source routing.
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.*.rp_filter = 2
-net.ipv4.conf.all.rp_filter
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.*.accept_source_route = 0
-net.ipv4.conf.all.accept_source_route

# Promote secondary addresses when the primary address is removed.
net.ipv4.conf.default.promote_secondaries = 1
net.ipv4.conf.*.promote_secondaries = 1
-net.ipv4.conf.all.promote_secondaries

# Not a router, and the platform sets addresses from the kernel command
# line, so ignore ICMP redirects and router advertisements.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
