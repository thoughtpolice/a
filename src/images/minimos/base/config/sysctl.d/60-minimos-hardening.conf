#
# Baseline hardening that is safe in any environment: every key in this
# file is network-namespace scoped. Kernel-global fs.*, dev.*, user.*,
# kernel.*, and vm.* keys that would leak onto the host kernel when this
# rootfs boots under docker live in
# /usr/lib/minimos/sysctl-vm.conf instead, applied by
# minimos-harden.service only on real VMs.
#
# systemd's 50-default.conf is denylisted (it mixes host-global fs.* and
# kernel.* keys into the automatic search path, which is exactly what the
# two-tier split exists to prevent), so its network half is restated here
# verbatim. Its host-global half moved to sysctl-vm.conf at stronger values.
#
# Two upstream defaults are deliberately not carried over:
# net.ipv4.ping_group_range, because no image ships a ping that would need
# unprivileged ICMP sockets, and net.core.default_qdisc, which is a
# bufferbloat tuning knob whose namespacing is not worth relying on here.

# Source route verification, and no source routing.
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.*.rp_filter = 2
-net.ipv4.conf.all.rp_filter
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.*.accept_source_route = 0
-net.ipv4.conf.all.accept_source_route

# Promote secondary addresses when the primary address is removed.
net.ipv4.conf.default.promote_secondaries = 1
net.ipv4.conf.*.promote_secondaries = 1
-net.ipv4.conf.all.promote_secondaries

# Not a router, and the platform configures addresses statically via the
# kernel cmdline: ignore ICMP redirects and router advertisements.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
