#
# Installed as /etc/tmpfiles.d/systemd.conf, which shadows the vendor
# file. Upstream's version sets journal ACLs for a wheel group. minimos
# gives its one owner journal access through the systemd-journal group
# instead.

d /run/user 0755 root root -
d /run/systemd/seats 0755 root root -
d /run/systemd/sessions 0755 root root -
d /run/systemd/users 0755 root root -
d /run/systemd/shutdown 0755 root root -
d /run/log 0755 root root -
d /run/log/journal 2755 root systemd-journal -

d /var/log/journal 2755 root systemd-journal -

# journald creates the per-machine directory itself as 0755 root:root,
# ignoring the parent's setgid group, and its journal files come out
# root:root 0640. Without these lines the systemd-journal group can't
# read anything, and `journalctl` on a VM says "No journal files were
# opened due to insufficient permissions". The setgid directory puts
# later journal files in the group, and the system.journal line fixes
# the file journald flushed before this ran.
z /run/log/journal/%m 2750 root systemd-journal -
z /var/log/journal/%m 2755 root systemd-journal -
z /var/log/journal/%m/system.journal 0640 root systemd-journal -
d /var/lib/systemd 0755 root root -
d /var/lib/private 0700 root root -
d /var/log/private 0700 root root -
d /var/cache/private 0700 root root -
