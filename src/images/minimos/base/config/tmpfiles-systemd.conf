# Minimal replacement for upstream systemd.conf. The upstream file installs
# journal ACLs for the distro-specific wheel group; minimos has fixed accounts
# and grants its single owner journal access through systemd-journal directly.

d /run/user 0755 root root -
d /run/systemd/seats 0755 root root -
d /run/systemd/sessions 0755 root root -
d /run/systemd/users 0755 root root -
d /run/systemd/shutdown 0755 root root -
d /run/log 0755 root root -
d /run/log/journal 2755 root systemd-journal -

d /var/log/journal 2755 root systemd-journal -

# journald creates the per-machine directory itself, as 0755 root:root — it
# does not inherit the setgid group from the parent — and the journal files
# inside it come out root:root 0640. Without these three lines the group
# ownership is never corrected, so being in systemd-journal buys the owner
# nothing and `journalctl` reports "No journal files were opened due to
# insufficient permissions" on a real VM. Setgid on the directory is what
# makes every *subsequent* journal file land in the group; the explicit
# system.journal line fixes the one flushed before this runs.
z /run/log/journal/%m 2750 root systemd-journal -
z /var/log/journal/%m 2755 root systemd-journal -
z /var/log/journal/%m/system.journal 0640 root systemd-journal -
d /var/lib/systemd 0755 root root -
d /var/lib/private 0700 root root -
d /var/log/private 0700 root root -
d /var/cache/private 0700 root root -
