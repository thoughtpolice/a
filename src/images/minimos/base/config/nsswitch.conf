#
# Only the NSS modules the base ships: files, dns, myhostname, and
# systemd, which resolves DynamicUser= accounts.

passwd:         files systemd
group:          files systemd
shadow:         files
gshadow:        files

# myhostname resolves the VM's own name, which comes from the kernel
# command line rather than /etc/hosts, without asking DNS.
hosts:          files myhostname dns
networks:       files

protocols:      files
services:       files
ethers:         files
rpc:            files

netgroup:       files
