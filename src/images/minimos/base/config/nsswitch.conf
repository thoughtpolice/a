passwd:         files systemd
group:          files systemd
shadow:         files
gshadow:        files

# myhostname resolves the VM's own name (which comes from the kernel
# cmdline, not /etc/hostname) without a round-trip to DNS.
hosts:          files myhostname dns
networks:       files

# Only the modules the image actually ships: files, dns, myhostname,
# compat, and systemd (for DynamicUser= services).
protocols:      files
services:       files
ethers:         files
rpc:            files

netgroup:       files
