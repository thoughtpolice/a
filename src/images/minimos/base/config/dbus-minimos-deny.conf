  SPDX-License-Identifier: Apache-2.0

  Installed as /etc/dbus-1/system.d/50-minimos-deny.conf. The vendor
  /usr/share/dbus-1/system.conf includes it after its own system.d
  directory, so these rules win.

  systemd's vendor policy lets any uid send StartUnit, StartTransientUnit,
  SetEnvironment, MaskUnitFiles and similar calls to PID 1, "Managed via
  polkit or other criteria". minimos ships no polkit, so the only thing
  refusing an unprivileged caller is systemd's fallback when polkit is
  unreachable. That works today, but it would change meaning the day some
  package brought polkit into an image.

  So the bus refuses the manager interfaces too. On a single-owner
  appliance only root manages system units. The read-only calls that
  `systemctl status` and `journalctl` make stay allowed for the owner.
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy context="default">
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Manager"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Unit"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Service"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Scope"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Slice"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Job"/>

    <!--
      Cgroup delegation needs one exception. When a user manager can't move
      a process into a scope it owns, as with an SSH child that starts in
      the platform listener's init.scope, it asks PID 1 to do the move.
      systemd checks that request against the uid that owns the unit, not
      polkit, so refusing it here would only break the dev images' login
      scopes. examples/dev's boot smoke exercises this path.
    -->
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="AttachProcessesToUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Service"
           send_member="AttachProcesses"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Scope"
           send_member="AttachProcesses"/>

    <!--
      The read-only calls the owner's tools need. GetUnitProcesses fills in
      the process tree under the CGroup: line of `systemctl status`.
      Without it the command still succeeds, the tree is just always empty,
      and the journal logs "Rejected send message ... GetUnitProcesses".
      It reads pids from a cgroup the caller can already see in /proc.
    -->
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnitProcesses"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="LoadUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnits"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitsFiltered"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitsByNames"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitsByPatterns"/>
    <!--
      `systemctl list-unit-files` asks for ListUnitFilesByPatterns and
      falls back to ListUnitFiles only when PID 1 doesn't know the method,
      not when the bus refuses it, so it needs both.
    -->
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitFiles"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitFilesByPatterns"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnitFileState"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListJobs"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="Subscribe"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="Unsubscribe"/>
  </policy>

</busconfig>
