  SPDX-License-Identifier: Apache-2.0

  Installed as /etc/dbus-1/system.d/50-minimos-deny.conf, which the vendor
  /usr/share/dbus-1/system.conf includes after its own system.d directory, so
  these rules override what ships there.

  systemd's vendor policy allows *any* uid to send StartUnit, StartTransientUnit,
  SetEnvironment, MaskUnitFiles and friends to PID 1, with the comment "Managed
  via polkit or other criteria". minimos ships no polkit. The deny therefore
  rests entirely on systemd's internal fallback, which refuses an unprivileged
  caller when polkit is unreachable — verified, but a single mechanism, and one
  that changes meaning the day a container runtime pulls polkit into the image.

  So state it at the bus layer too: on a single-owner appliance nothing but
  root has any business managing system units, and read-only introspection
  (the Get/List/Subscribe half of the vendor policy) is left alone so
  `systemctl status` and `journalctl` keep working for the owner.
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy context="default">
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Manager"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Unit"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Service"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Scope"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Slice"/>
    <deny send_destination="org.freedesktop.systemd1"
          send_interface="org.freedesktop.systemd1.Job"/>

    <!--
      Cgroup delegation is the one exception, and it is not a polkit hole:
      when a per-user manager cannot move a process into a scope it owns
      (an SSH child starts in the platform listener's init.scope, outside
      the delegated subtree), it asks PID 1 to do it. systemd authorizes
      that against the *unit's owning uid*, not via polkit, so denying it
      here would break the dev images' bounded login scopes rather than
      close a hole. examples/dev's boot smoke exercises exactly this path.
    -->
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="AttachProcessesToUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Service"
           send_member="AttachProcesses"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Scope"
           send_member="AttachProcesses"/>

    <!-- Restore the read-only surface the owner's tooling needs. -->
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="LoadUnit"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnits"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitsFiltered"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitsByNames"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitsByPatterns"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListUnitFiles"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnitFileState"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="ListJobs"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="Subscribe"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="Unsubscribe"/>
  </policy>

</busconfig>
