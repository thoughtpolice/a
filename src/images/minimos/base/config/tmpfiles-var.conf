#
# Installed as /etc/tmpfiles.d/var.conf, which shadows the vendor file.
# Upstream's version also creates /var/log/{wtmp,btmp,lastlog} in a utmp
# group the baked accounts don't define, which fails on every boot. An
# image with no login(1), no PAM and nothing writing utmp has no use for
# those files. The rest of upstream's list is unchanged.

q /var 0755 - - -
L /var/run - - - - ../run
d /var/log 0755 - - -
d /var/cache 0755 - - -
d /var/lib 0755 - - -
d /var/spool 0755 - - -
