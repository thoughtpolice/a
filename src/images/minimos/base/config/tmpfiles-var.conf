# Installed as /etc/tmpfiles.d/var.conf, which shadows the vendor file of the
# same name. Upstream's version creates /var/log/{wtmp,btmp,lastlog} owned by
# an `utmp` group. minimos bakes its accounts and defines no such group, so
# those three lines fail to resolve it on every boot; the login-record files
# themselves are dead weight in an image with no login(1), no PAM, and no
# utmp-writing service. Everything else upstream creates is kept.

q /var 0755 - - -
L /var/run - - - - ../run
d /var/log 0755 - - -
d /var/cache 0755 - - -
d /var/lib 0755 - - -
d /var/spool 0755 - - -
