#
# Processed by chronyd.service's ExecStartPre via
# `systemd-tmpfiles --create <this file>`: the KVM PTP device has to be
# readable by the account chronyd drops to, and a devtmpfs node is the
# one path in this service's world that cannot be baked into the image.
#
# Deliberately NOT installed under tmpfiles.d/: the boot-time pass runs
# on every machine, including the docker boot smoke and any future
# platform without a PTP device, and would log a failure there. Applied
# from the unit instead, it runs only where the unit's
# ConditionPathExists=/dev/ptp0 already held.
#
# 0640 root:chrony — one group, read-only — rather than the 0666 across
# half of /dev that systemd's own static-nodes-permissions.conf would
# apply, which is why the base denies that file outright.
z /dev/ptp0 0640 root chrony -
