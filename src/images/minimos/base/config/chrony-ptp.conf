#
# chronyd.service's ExecStartPre runs `systemd-tmpfiles --create <this
# file>` so the account chronyd drops to can read the KVM PTP device. A
# devtmpfs node is the one path chronyd needs that the image can't bake.
#
# It lives outside tmpfiles.d because the boot-time pass runs everywhere,
# including the docker boot smoke and any host with no PTP device, and
# would log a failure there. The unit only gets this far after its
# ConditionPathExists=/dev/ptp0 has passed.
#
# One group gets read access. systemd's static-nodes-permissions.conf
# would open half of /dev to everyone with 0666, which is why the base
# denies it.
z /dev/ptp0 0640 root chrony -
