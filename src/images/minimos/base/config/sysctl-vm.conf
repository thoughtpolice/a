#
# Kernel-global hardening, applied by minimos-harden.service on anything
# that isn't a container. Under docker the boot smoke shares the host's
# kernel, and some of these keys stay set until reboot, so this file lives
# outside /etc/sysctl.d where systemd-sysctl's normal pass would find it.
#
# A `-` prefix makes systemd-sysctl skip a key quietly when the running
# kernel lacks it. It marks keys missing from the current exe.dev kernel
# and keys that depend on optional kernel config.

# The platform kernel has no module signing and the image ships no
# /lib/modules, so module loading shuts off for the rest of the boot.
# This stands in for Bottlerocket's lockdown=integrity.
kernel.modules_disabled = 1

kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 2
-net.core.bpf_jit_harden = 2
fs.suid_dumpable = 0
kernel.randomize_va_space = 2
kernel.perf_event_paranoid = 3

# The host-global half of systemd's denylisted 50-default.conf. sysrq is
# off entirely, where upstream allows sync, since the platform gives no
# console to type it on. The platform kernel lacks MAGIC_SYSRQ anyway.
# A larger PID space makes PID reuse rarer.
-kernel.sysrq = 0
kernel.pid_max = 4194304

# Reboot on a kernel oops rather than run on with corrupted state, as
# Bottlerocket does.
kernel.panic_on_oops = 1
kernel.panic = 10

# Root keeps io_uring and unprivileged code loses it. io_uring has been
# the most common kernel privilege escalation path in recent years, and
# runtimes that probe for it fall back.
-kernel.io_uring_disabled = 1

# Not built into the current platform kernel.
-kernel.yama.ptrace_scope = 1
-kernel.kexec_load_disabled = 1
-vm.unprivileged_userfaultfd = 0

# KSPP filesystem and tty protections. These are host-global too.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
dev.tty.ldisc_autoload = 0
-dev.tty.legacy_tiocsti = 0

# Development workloads need many watchers and memory maps. The limits
# stay finite, and cgroup memory and task ceilings back them up.
fs.inotify.max_user_instances = 4096
fs.inotify.max_user_watches = 262144
vm.max_map_count = 1048576

# User namespaces stay available for rootless sandboxes and containers,
# with a ceiling so one process can't pin unbounded namespace objects and
# the kernel memory behind them.
-user.max_cgroup_namespaces = 4096
-user.max_ipc_namespaces = 4096
-user.max_mnt_namespaces = 4096
-user.max_net_namespaces = 4096
-user.max_pid_namespaces = 4096
-user.max_time_namespaces = 4096
-user.max_user_namespaces = 4096
-user.max_uts_namespaces = 4096
