#
# Kernel-global hardening applied only on real VMs, by
# minimos-harden.service (ConditionVirtualization=vm). These
# keys are host-wide — under docker the boot smokes share the dev
# machine's kernel, and some of them latch until reboot, so they must
# never run there. This file deliberately lives outside /etc/sysctl.d
# so systemd-sysctl's normal pass skips it.
#
# `-` prefixed keys don't exist on the current exe.dev kernel; they
# apply automatically if a future platform kernel gains them.

# The platform kernel has no module signing and the image ships no
# /lib/modules; latch module loading shut for the rest of the boot.
# This is minimos's substitute for Bottlerocket's lockdown=integrity.
kernel.modules_disabled = 1

kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 2
-net.core.bpf_jit_harden = 2
fs.suid_dumpable = 0
kernel.randomize_va_space = 2
kernel.perf_event_paranoid = 3

# systemd's 50-default.conf, which would otherwise set these from the
# automatic search path on any kernel this rootfs boots on, is denylisted.
# Its two host-global settings are carried here instead: sysrq off outright
# rather than upstream's 16 (sync only) — the platform gives no console to
# type it on — and the PID-space bump, which makes PID reuse rarer.
# sysrq takes the `-` prefix for the usual reason: the platform kernel is
# built without MAGIC_SYSRQ, so the key is absent and an unprefixed line
# would log a warning on every boot.
-kernel.sysrq = 0
kernel.pid_max = 4194304

# Appliance behavior (Bottlerocket parity): reboot on kernel oops
# rather than limping along on corrupted state.
kernel.panic_on_oops = 1
kernel.panic = 10

# Root keeps io_uring; unprivileged code loses it (the dominant kernel
# LPE surface of recent years). Runtimes probe and fall back.
-kernel.io_uring_disabled = 1

# Not built into the current platform kernel.
-kernel.yama.ptrace_scope = 1
-kernel.kexec_load_disabled = 1
-vm.unprivileged_userfaultfd = 0

# Host-global KSPP filesystem and tty protections. These cannot live in
# /etc/sysctl.d because a privileged container would otherwise modify the
# outer Docker host during boot testing.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
dev.tty.ldisc_autoload = 0
-dev.tty.legacy_tiocsti = 0

# Development workloads need watchers and large mmap counts, but the limits
# must remain finite and are paired with cgroup memory/task ceilings.
fs.inotify.max_user_instances = 4096
fs.inotify.max_user_watches = 262144
vm.max_map_count = 1048576

# Keep rootless sandbox/container namespaces available without allowing one
# process to pin effectively unlimited namespace objects and kernel memory.
-user.max_cgroup_namespaces = 4096
-user.max_ipc_namespaces = 4096
-user.max_mnt_namespaces = 4096
-user.max_net_namespaces = 4096
-user.max_pid_namespaces = 4096
-user.max_time_namespaces = 4096
-user.max_user_namespaces = 4096
-user.max_uts_namespaces = 4096
