#
# Codex set up for exe.dev's ChatGPT integration. Create the VM with
# `--integration=chatgpt`, and the platform proxies this endpoint to
# ChatGPT on the account that owns the VM, so no API key is ever in the
# image. `codex -c ...` overrides it for one run.

model_provider = "exe-chatgpt"

[model_providers.exe-chatgpt]
name = "exe-chatgpt"
base_url = "https://chatgpt.int.exe.xyz/v1"
