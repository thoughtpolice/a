#
# Loopback only, logs to journald, and no persistence. The state
# directory exists, but nothing writes to it.

bind 127.0.0.1 -::1
port 6379
daemonize no
supervised no
logfile ""
save ""
appendonly no
# Refuse writes well before the unit's 192 MiB MemoryHigh= and 256 MiB
# MemoryMax=, rather than get OOM-killed and restart in a loop.
maxmemory 160mb
maxmemory-policy noeviction
dir /var/lib/valkey
