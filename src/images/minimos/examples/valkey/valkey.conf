# Minimal valkey config for the minimos example: loopback only, journald
# for logs, no persistence (the state dir exists but nothing writes it).

bind 127.0.0.1 -::1
port 6379
daemonize no
supervised no
logfile ""
save ""
appendonly no
# Refuse writes before allocator/process overhead reaches the unit's 192 MiB
# MemoryHigh and 256 MiB hard cgroup limit; avoid an OOM/restart loop.
maxmemory 160mb
maxmemory-policy noeviction
dir /var/lib/valkey
