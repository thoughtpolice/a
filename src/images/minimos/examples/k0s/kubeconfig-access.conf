#
# k0s-kubeconfig.service runs `systemd-tmpfiles --create <this file>`
# after it writes the kubeconfig, which systemd creates as root. It lives
# outside tmpfiles.d because the boot-time pass runs before the file
# exists. The file sits in a root-owned directory because tmpfiles won't
# change a file under a directory another user owns, such as a home.
z /var/lib/k0s-kubeconfig/admin.conf 0640 root exedev - -
