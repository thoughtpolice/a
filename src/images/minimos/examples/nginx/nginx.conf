#
# nginx config for minimos-nginx. It includes nothing but mime.types.

# No `user` directive. The unit runs master and workers as its dynamic
# user, and nginx warns about the directive when the master isn't root.

# systemd supervises nginx in the foreground.
daemon off;

worker_processes 1;
# nginx writes the literal `stderr` straight to fd 2. `/dev/stderr` would
# be reopened, and opening systemd's journal socket that way fails with
# ENXIO.
error_log stderr warn;
# /run/nginx is the unit's RuntimeDirectory=, which the dynamic user can
# write. /run itself isn't writable.
pid /run/nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access records go to journald's syslog socket, where the base's
    # journal size cap and rate limit apply.
    access_log syslog:server=unix:/run/systemd/journal/dev-log,facility=local7,tag=nginx_access,nohostname combined;
    sendfile on;
    keepalive_timeout 65;

    # Buffered request bodies go to the unit's private /tmp, which
    # DynamicUser= implies, rather than /var/lib/nginx.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        # :80 is the port exe.dev's proxy picks. The unit grants
        # CAP_NET_BIND_SERVICE for it. :8000 and :8080 need nothing.
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 8000 default_server;
        listen [::]:8000 default_server;
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /var/www/minimos;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
