#
# Minimal nginx config for the minimos-nginx-test image. Replaces Debian's
# stock /etc/nginx/nginx.conf, which pulls in sites-enabled/, conf.d/, and
# modules-enabled/ — none of which we ship.

# No `user` directive: the unit runs master and workers as its
# DynamicUser (the directive only means anything when the master is
# root, and nginx warns about it otherwise).

# Run in foreground when invoked without systemd (exe.dev Cmd test).
daemon off;

worker_processes 1;
# nginx special-cases the literal `stderr` and writes straight to fd 2.
# `/dev/stderr` would be re-opened, which fails when fd 2 is systemd's
# journal pipe (ENXIO on open of a pipe-backed /proc/self/fd/N).
error_log stderr warn;
# /run/nginx is the unit's RuntimeDirectory (writable by the dynamic
# user; /run itself is not).
pid /run/nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Send access records directly to journald's syslog socket so the base's
    # journal quota and rate limit bound their disk and CPU impact.
    access_log syslog:server=unix:/run/systemd/journal/dev-log,facility=local7,tag=nginx_access,nohostname combined;
    sendfile on;
    keepalive_timeout 65;

    # /tmp is a tmpfs in the systemd container, so stash all buffered
    # request bodies there rather than shipping /var/lib/nginx/*.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        # Listen on :80 (exe.dev's default auto-selected port), :8000 and
        # :8080 (unprivileged alternates). The systemd unit grants only
        # CAP_NET_BIND_SERVICE so its dynamic user can bind :80 while the
        # base retains ip_unprivileged_port_start=1024.
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 8000 default_server;
        listen [::]:8000 default_server;
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /var/www/minimos;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
