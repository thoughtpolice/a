#
# Processed by containerd.service's ExecStartPost via
# `systemd-tmpfiles --create <this file>`, which is how the control
# socket ends up reachable by the account exe.dev logs SSH sessions into.
#
# Deliberately NOT installed under tmpfiles.d/: the boot-time pass runs
# long before containerd creates the socket, so a line there would either
# do nothing or (with a create verb) leave a stale file in the way.
# containerd's own [grpc] uid/gid settings no longer chown the socket in
# 2.x — they parse, they dump back out, and nothing happens — so this is
# the mechanism that actually works, and it is visible in the unit rather
# than buried in a config key that silently does nothing.
z /run/containerd/containerd.sock 0660 root exedev - -
