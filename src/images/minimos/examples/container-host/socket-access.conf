#
# containerd.service's ExecStartPost runs `systemd-tmpfiles --create <this
# file>` to hand the control socket to exedev, the account SSH logins land
# in. containerd 2.x parses its own [grpc] uid/gid settings and then
# ignores them.
#
# It lives outside tmpfiles.d because the boot-time pass runs long before
# containerd creates the socket.
z /run/containerd/containerd.sock 0660 root exedev - -
