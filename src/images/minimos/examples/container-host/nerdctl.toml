#
# /etc/nerdctl/nerdctl.toml, client defaults for nerdctl. nerdctl has no
# setting for its runtime. The io.containerd.runc.v2 default is compiled
# in, and since the image ships no runc shim, using the default fails
# instead of escaping the sandbox. container@.service passes
# --runtime=io.containerd.runsc.v1. Nothing rewrites nerdctl's arguments
# to add it behind your back.

debug = false
address = "unix:///run/containerd/containerd.sock"
namespace = "default"
snapshotter = "overlayfs"

# cgroupfs, even on a systemd image. nerdctl refuses the systemd manager
# for any runtime but runc and falls back to cgroupfs with a warning, so
# the client and runsc-config.toml both say cgroupfs up front. Container
# cgroups live at /sys/fs/cgroup/<namespace>/<id> rather than under a
# slice. Bound them with --memory, --cpus and --pids-limit, or place them
# with --cgroup-parent.
cgroup_manager = "cgroupfs"

# Wolfi installs the CNI plugins in /usr/bin. The overlay links the ones
# the image keeps into the usual directory, so the plugin path doesn't
# include every other program in /usr/bin.
cni_path = "/opt/cni/bin"
cni_netconfpath = "/etc/cni/net.d"

data_root = "/var/lib/nerdctl"
