#
# /etc/containerd/runsc/config.toml, the gVisor shim's own configuration.
#
# containerd only passes a shim the runtime options a client sent, and
# `nerdctl run` and `ctr run` send none. When it gets none, the gVisor
# shim reads /run/containerd/runsc/config.toml and then this file. That
# makes this the one config that covers every sandbox, whichever client
# started it.
#
# Top-level keys are shim options. The [runsc_config] table goes to runsc
# as `--key=value` flags.

# An absolute path, so a sandbox doesn't depend on containerd's PATH.
binary_name = "/usr/local/bin/runsc"

[runsc_config]
  # gVisor's default, stated because the KVM platform isn't an option.
  # exe.dev VMs have /dev/kvm but no working nested VMX. systrap catches
  # syscalls with seccomp and a signal handler, needs no device, and
  # works on the platform's 6.12 kernel.
  platform = "systrap"

  # No systemd-cgroup, though scopes under the base's slices would be
  # tidier. The client picks the cgroupsPath syntax and the runtime has
  # to parse it. nerdctl refuses the systemd manager for any runtime but
  # runc ("cannot set cgroup manager to systemd for runtime
  # io.containerd.runsc.v1") and sends a cgroupfs path anyway, so a
  # runsc expecting slice:prefix:name would get /default/<id>.
  # nerdctl.toml says cgroupfs from the client side.
