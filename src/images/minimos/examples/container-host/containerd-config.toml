#
# /etc/containerd/config.toml, for containerd 2.x with schema version 4.
#
# containerd merges this over its built-in defaults, so the file only
# holds what minimos changes. How a sandbox is built lives in
# /etc/containerd/runsc/config.toml, which the shim reads itself, so it
# covers nerdctl and ctr containers as well as CRI ones.

version = 4

# Keep containerd's info messages out of the journal. The boot smoke
# expects a journal that only speaks up when something is wrong.
[debug]
  level = 'warn'

[plugins]
  [plugins.'io.containerd.cri.v1.runtime']
    [plugins.'io.containerd.cri.v1.runtime'.containerd]
      # The CRI plugin is the only place containerd keeps a server-side
      # default runtime. Its built-in `runc` handler stays registered, and
      # a TOML merge can't remove it, but no layer ships
      # containerd-shim-runc-v2, so asking for runc fails rather than
      # starting an unsandboxed container.
      default_runtime_name = 'runsc'

      [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes]
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runsc]
          runtime_type = 'io.containerd.runsc.v1'

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runsc.options]
            TypeUrl = 'io.containerd.runsc.v1.options'
            ConfigPath = '/etc/containerd/runsc/config.toml'
