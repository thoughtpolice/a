#
# minimos ships no PAM at all (no libpam, /etc/pam.d is culled), so the
# upstream PAMName=systemd-user would make every user@ instance fail at
# exec. Resetting it makes systemd spawn `systemd --user` directly;
# XDG_RUNTIME_DIR then has to be set by hand, because pam_systemd was
# what injected it (this mirrors exactly what upstream's own
# PAM-disabled build of user@.service.in does). Nothing of value is
# lost: PAM's job here is session registration for interactive logins,
# and exe.dev logins come through the platform sshd, which never talks
# to logind anyway — user@1000 exists because exedev lingers
# (var/lib/systemd/linger/exedev), not because of any session.

[Service]
PAMName=
Environment=XDG_RUNTIME_DIR=/run/user/%i
