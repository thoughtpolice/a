[Service]
# The outer user.slice supplies the aggregate ceiling. A runtime or build tool
# may subdivide its own SSH scope across the controllers that exe.dev's cgroup
# v2 kernel exposes, but cannot modify the parent ceiling.
Delegate=cpu cpuset io memory pids
OOMPolicy=continue
OOMScoreAdjust=-100
TasksMax=3072
TimeoutStopSec=30s
