[language-server.rust-analyzer.config.server]
path = "rust-analyzer"

[language-server.rust-analyzer.config.check]
overrideCommand = ["rust-project", "check", "$saved_file"]

[language-server.rust-analyzer.config.workspace.discoverConfig]
command = ["rust-project", "develop-json", "--sysroot-mode=rustc", "{arg}"]
progressLabel = "rust-analyzer[buck2]"
filesToWatch = ["BUILD", "PACKAGE"]

# The Lean server takes each file's imports from Buck instead of Lake (see
# buck/toolchains/lean/lsp). Helix starts servers in the workspace root.
[language-server.lean]
command = "/bin/sh"
args = ["-c", "exec \"$(buck2 root --kind project)/buck/toolchains/lean/lsp/lake\" serve"]

# gopls, with Buck answering its package queries (see
# buck/toolchains/golang/lsp). The filters keep gopls from diagnosing the
# stdlib and golang.org/x sources under buck-out, and the other checkouts
# under work/, as packages of the workspace.
[language-server.gopls]
command = "/bin/sh"
args = ["-c", "exec \"$(buck2 root --kind project)/buck/toolchains/golang/lsp/gopls\""]

[language-server.gopls.config]
directoryFilters = ["-buck-out", "-work", "-**/node_modules"]

# Go files take their workspace root from the Buck project rather than the
# nearest go.mod, which only the stdlib and golang.org/x under buck-out have:
# jumping to a definition there would otherwise add a workspace folder, and
# gopls a view, for that module.
[[language]]
name = "go"
roots = [".buckroot"]
