[language-server.rust-analyzer.config.server]
path = "rust-analyzer"

[language-server.rust-analyzer.config.check]
overrideCommand = ["rust-project", "check", "$saved_file"]

[language-server.rust-analyzer.config.workspace.discoverConfig]
command = ["rust-project", "develop-json", "--sysroot-mode=rustc", "{arg}"]
progressLabel = "rust-analyzer[buck2]"
filesToWatch = ["BUILD", "PACKAGE"]

# The Lean server takes each file's imports from Buck instead of Lake (see
# buck/toolchains/lean/lsp). Helix starts servers in the workspace root.
[language-server.lean]
command = "/bin/sh"
args = ["-c", "exec \"$(buck2 root --kind project)/buck/toolchains/lean/lsp/lake\" serve"]

# TypeScript and JavaScript go to Deno through celld-project, which gives the
# celld units (no checked-in deno.json) their import maps from Buck; see
# buck/toolchains/celld/README.md. enablePaths and the preload limit let Deno
# find the hand-written deno.json packages past buck-out/ and work/.
[language-server.celld-project]
command = "celld-project"
args = ["lsp"]
config.deno = { enable = true, enablePaths = ["src", "tilde", "buck/toolchains"], documentPreloadLimit = 5000 }

[[language]]
name = "typescript"
file-types = ["ts", "tsx"]
language-servers = ["celld-project"]
auto-format = true

[[language]]
name = "javascript"
file-types = ["js", "jsx"]
language-servers = ["celld-project"]
auto-format = true
