name: Install DotSlash
description: Install DotSlash on the current system
inputs:
  version:
    description: "version of dotslash"
    required: false
    default: "0.5.2"
runs:
  using: "composite"
  steps:
    - name: Install DotSlash
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: | # zizmor: ignore[github-env]
        mkdir -p $RUNNER_TEMP/dotslash
        echo "$RUNNER_TEMP/dotslash" >> $GITHUB_PATH

        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # DotSlash picks the executable for the machine it was built for, so
          # an arm64 runner needs arm64's (published from 0.5.9 on), not x64's
          # under emulation.
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            asset=dotslash-windows-arm64.v$INPUT_VERSION.tar.gz
          else
            asset=dotslash-windows.v$INPUT_VERSION.tar.gz
          fi
          curl -fsSLO https://github.com/facebook/dotslash/releases/download/v$INPUT_VERSION/$asset
          tar xf $asset dotslash.exe
          mv dotslash.exe $RUNNER_TEMP/dotslash
          rm $asset
        else
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            wget https://github.com/facebook/dotslash/releases/download/v$INPUT_VERSION/dotslash-macos.v$INPUT_VERSION.tar.gz
            tar xf dotslash-macos.v$INPUT_VERSION.tar.gz dotslash
            rm dotslash-macos.v$INPUT_VERSION.tar.gz
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            if [[ "$(uname -m)" == "aarch64" ]]; then
              wget https://github.com/facebook/dotslash/releases/download/v$INPUT_VERSION/dotslash-ubuntu-22.04.arm64.v$INPUT_VERSION.tar.gz
              tar xf dotslash-ubuntu-22.04.arm64.v$INPUT_VERSION.tar.gz dotslash
              rm dotslash-ubuntu-22.04.arm64.v$INPUT_VERSION.tar.gz
            else
              wget https://github.com/facebook/dotslash/releases/download/v$INPUT_VERSION/dotslash-ubuntu-22.04.x86_64.v$INPUT_VERSION.tar.gz
              tar xf dotslash-ubuntu-22.04.x86_64.v$INPUT_VERSION.tar.gz dotslash
              rm dotslash-ubuntu-22.04.x86_64.v$INPUT_VERSION.tar.gz
            fi
          fi
          mv dotslash $RUNNER_TEMP/dotslash
        fi
