name: ci

on:
  push:
    branches:
      - canon
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  # Every push to canon and every pull request is tested through target
  # determination: check.py runs tdutil over the change, and only what it
  # selects is tested. The job keeps the name `integrate` because the trunk
  # ruleset requires its checks by that name.
  build:
    name: integrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            abi: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            abi: aarch64-unknown-linux-gnu
          #- os: windows-2022
          #  abi: x86_64-pc-windows-msvc
          - os: macos-15
            abi: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # A change to the build configuration, or a determination that fails,
    # tests everything, so this is sized for that rather than the common case.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.7.12"
          # There is no Python project here for uv to resolve, so the cache
          # would be keyed on dependency files that never exist and thus never
          # invalidate. Buck2 owns the caching that actually matters.
          enable-cache: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0
        with:
          toolchain: "nightly-2026-03-24"
      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.1.1'
      - name: (Linux) Install packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          cargo install bindgen-cli --version 0.72.1 --locked
      - name: (macOS) Install packages
        if: runner.os == 'macOS'
        run: |
          # The runner image ships an untrusted aws/tap, which makes every brew
          # invocation warn. Nothing here uses it, so drop it; trust checks stay
          # enabled for the install below.
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew untap aws/tap || true
          brew install go
          cargo install bindgen-cli --version 0.72.1 --locked
      - name: Install DotSlash
        uses: ./.github/actions/install-dotslash
      - name: Install Lean
        uses: ./.github/actions/install-lean
      - name: Set up environment
        shell: bash
        run: echo "PATH=$GITHUB_WORKSPACE/buck/bin:$GITHUB_WORKSPACE/buck/bin/extra:$PATH" >> $GITHUB_ENV
      - name: Configure Buck2 for CI
        shell: bash
        run: |
          printf '\n' >> .buckconfig.local
          cat buck/ci.buckconfig >> .buckconfig.local
      - name: Init jj repository
        shell: bash
        run: dotslash ./buck/bin/extra/jj git init --colocate

      # The commits tdutil compares. A pull request is tested as GitHub's merge
      # of it into the base branch, which is what was checked out, so it is
      # compared with that merge's first parent: exactly the pull request's
      # changes, on top of the base as it is now. A push is compared with the
      # commit it replaced. Anything else has no base, and tests everything.
      - name: Resolve comparison commits
        id: commits
        shell: bash
        run: |
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          # A push which creates the branch has no commit before it.
          if [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}

      # Optimistically reuse the base commit's graph, captured by an earlier
      # push run. tdutil validates the snapshot against the requested commit,
      # universe, configuration, and buck2 version, and silently collects the
      # base graph itself when the snapshot is missing or unusable.
      #
      # The restore, tdutil, and save steps below must all name the same file.
      # actions/cache derives an entry version from the `path` input, so a save
      # and a restore that disagree on the filename never see each other's
      # entries, even when their keys match byte for byte.
      - name: Restore base graph snapshot
        if: steps.commits.outputs.base != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tdutil-snapshot.json
          key: tdutil-base-snapshot-v1-${{ matrix.abi }}-${{ steps.commits.outputs.base }}-${{ hashFiles('buck/bin/buck2', 'buck/ci.buckconfig') }}

      # check.py builds tdutil and runs it over the universe CI tests, printing
      # the affected targets; see its docstring. CI configuration is passed to
      # tdutil's graph queries, which must describe the same graph the test
      # step builds.
      #
      # On a push, --snapshot-head-to records the head graph this run has
      # already collected, so refreshing the trunk snapshot costs only the
      # serialization rather than a second full collection. It goes to a
      # distinct path so that its existence is an unambiguous signal that a new
      # snapshot was written, rather than the restored base file still sitting
      # there. Failing to write it is reported by tdutil and never fails the run.
      #
      # With no base, or when a determination fails and so names nothing
      # trustworthy, `check.py --everything` lists every target CI tests, a
      # superset of any selection, and that is tested instead. Both leave out
      # what check.py's EXCLUDE does, so no runner builds a vendored crate on
      # its own. tdutil fails closed on a Buck graph error at either endpoint,
      # and the listing then reports the error itself: this is how a package
      # which no longer loads is surfaced, whether or not the diff touched it.
      - name: Determine affected targets
        id: determine
        shell: bash
        run: |
          TARGETS="$RUNNER_TEMP/affected-targets.txt"
          SCOPE=affected
          if [ -z "$BASE" ]; then
            SCOPE=everything
          else
            CAPTURE=()
            if [ "$EVENT" = push ]; then
              CAPTURE=(--snapshot-head-to "$RUNNER_TEMP/tdutil-snapshot-new.json")
            fi
            if ! ./check.py \
                --config ci.depot_gha_ci=true \
                --verbose \
                --from "$BASE" \
                --to "$HEAD" \
                --base-snapshot "$RUNNER_TEMP/tdutil-snapshot.json" \
                "${CAPTURE[@]}" \
                > "$TARGETS"; then
              echo "::warning::Target determination failed; testing everything instead."
              SCOPE=everything
            fi
          fi
          if [ "$SCOPE" = everything ]; then
            ./check.py --everything @buck/ci.buckargs > "$TARGETS"
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          {
            echo "## Target determination"
            echo "Testing $(wc -l < "$TARGETS") target(s): $SCOPE."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}

      # The determination step above already wrote the new trunk snapshot, so
      # there is nothing left to collect here. Move it onto the path the
      # restore step named: actions/cache derives an entry version from
      # `path`, so a save which names a different file would never be found
      # by the restore above, however exactly their keys matched. An absent
      # file means tdutil declined or failed to write one, which costs the
      # next run a base collection and is not a build failure.
      - name: Stage the new base graph snapshot
        id: capture-snapshot
        if: github.event_name == 'push'
        shell: bash
        run: |
          NEW_SNAPSHOT="$RUNNER_TEMP/tdutil-snapshot-new.json"
          if [ -s "$NEW_SNAPSHOT" ]; then
            mv -f -- "$NEW_SNAPSHOT" "$RUNNER_TEMP/tdutil-snapshot.json"
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "No new snapshot was written; the next run collects its base graph."
          fi
      - name: Save base graph snapshot
        if: github.event_name == 'push' && steps.capture-snapshot.outputs.captured == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tdutil-snapshot.json
          key: tdutil-base-snapshot-v1-${{ matrix.abi }}-${{ steps.commits.outputs.head }}-${{ hashFiles('buck/bin/buck2', 'buck/ci.buckconfig') }}

      - name: buck2 test ...
        shell: bash
        run: |
          # A few attempts ride out a flaky download; a real failure fails
          # every attempt, and each repeats only what is not already built.
          retry_command() {
            local max_attempts=3
            local attempt=1
            local exit_code=0

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts..."

              if "$@"; then
                echo "Command succeeded on attempt $attempt"
                return 0
              else
                exit_code=$?
                echo "Command failed with exit code $exit_code on attempt $attempt"

                if [ $attempt -lt $max_attempts ]; then
                  local wait_time=$((2 ** (attempt - 1)))
                  echo "Waiting ${wait_time}s before retry..."
                  sleep $wait_time
                fi
              fi

              attempt=$((attempt + 1))
            done

            echo "All $max_attempts attempts failed"
            return $exit_code
          }

          REPORT=(
            --build-report "$RUNNER_TEMP/build-report.json"
            --build-report-options fill-out-failures
          )
          COUNT=$(wc -l < "$TARGETS")
          if [ "$COUNT" -eq 0 ]; then
            echo "No targets are affected; there is nothing to test."
            exit 0
          fi
          echo "Testing $COUNT target(s)"
          # The list names targets regardless of platform, and this runner
          # tests the ones it can.
          retry_command buck2 test @buck/ci.buckargs -m debug "@$TARGETS" \
            --skip-incompatible-targets "${REPORT[@]}" --
        env:
          TARGETS: ${{ steps.determine.outputs.targets }}
      - name: Generate build report
        if: always()
        shell: bash
        run: |
          # Report generation is informational: pass/fail signal comes from
          # the test step, and the summary matters most when that failed.
          REPORT="$RUNNER_TEMP/build-report.json"
          if [ -f "$REPORT" ]; then
            buck2 run root//buck/tools/build-report:build-report -- "$REPORT" || true
            buck2 run root//buck/tools/build-report:build-report -- --format markdown "$REPORT" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "Build report file not found, skipping report generation"
          fi

  # The osv.dev check asks that database whether anything this repository pins
  # is subject to a published advisory, so its verdict tracks the database rather
  # than the commit under test: an advisory filed upstream overnight fails every
  # build afterwards, including the many that touch nothing related. The
  # `external-data` label keeps it out of the sweeps above (see `[test]
  # default_exclude_labels` in .buckconfig) and it runs here instead, named
  # directly and with the filters off so neither path can skip it.
  #
  # The answer does not depend on the host, so one runner reports it once. The
  # job is advisory in both senses: it never fails the workflow, because a pin
  # that needs bumping is not a reason to block an unrelated change. Read the
  # advisories in the job summary and fix them on their own schedule, either by
  # bumping the pin or by recording an exception in buck/osv.dev.
  advisories:
    name: advisories
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install DotSlash
        uses: ./.github/actions/install-dotslash
      - name: Set up environment
        shell: bash
        run: echo "PATH=$GITHUB_WORKSPACE/buck/bin:$GITHUB_WORKSPACE/buck/bin/extra:$PATH" >> $GITHUB_ENV
      - name: Configure Buck2 for CI
        shell: bash
        run: |
          printf '\n' >> .buckconfig.local
          cat buck/ci.buckconfig >> .buckconfig.local
      - name: Init jj repository
        shell: bash
        run: dotslash ./buck/bin/extra/jj git init --colocate
      - name: buck2 test root//buck/osv.dev:check
        shell: bash
        run: |
          # Deliberately no retry loop: a failure here is a published advisory,
          # not a flake, and re-running the check only reprints it.
          buck2 test @buck/ci.buckargs -m debug root//buck/osv.dev:check \
            --no-default-test-filters 2>&1 | tee "$RUNNER_TEMP/advisories.log"
      - name: Summarize advisories
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/advisories.log"
          if [ ! -f "$LOG" ]; then
            echo "The check produced no output; see the step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Strip the console's color codes and timestamp prefixes, then keep
          # the tally, the per-package `[FAIL]` blocks, and the scan totals a
          # failing case reports. A block runs from its `[FAIL]` line to the
          # next unindented line.
          sed -E $'s/\033\[[0-9;]*m//g; s/^\[[^]]*\] //' "$LOG" | awk '
            /^\[FAIL\]/ { block = 1; print; next }
            block && /^[[:space:]]/ { print; next }
            { block = 0 }
            /^Scanned |^Tests finished:/ { print }
          ' > "$RUNNER_TEMP/advisories.txt"

          {
            echo "## Advisories"
            echo
            echo "\`buck2 test root//buck/osv.dev:check\`, against osv.dev."
            echo
            if [ -s "$RUNNER_TEMP/advisories.txt" ]; then
              echo '```'
              cat "$RUNNER_TEMP/advisories.txt"
              echo '```'
            else
              echo "The check reported nothing to summarize; see the step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false

      - name: Run zizmor 🌈
        run: uvx zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          sarif_file: results.sarif
          category: zizmor
