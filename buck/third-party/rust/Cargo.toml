[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
publish = false
edition = "2021"

# Dummy target to keep Cargo happy
[[bin]]
name = "top"
path = "top.rs"

[dependencies]
anyhow = "1.0.103"
argh = "0.1.19"
ariadne = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1"
base64 = "0.22.1"
blake3 = "1.8.5"
brotli = "8.0"
buck-resources = "1"
bytes = "1.12.1"
capnp = "0.26.2"
capnpc = "0.26.0"
capnp-futures = "0.26.1"
capnp-rpc = "0.26.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chumsky = { version = "0.13.0", features = ["either", "memoization", "pratt", "regex", "serde", "stacker"] }
clap = { version = "4.6", features = ["derive"] }
console-subscriber = "0.5.0"
cedar-policy = "4.11.2"
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
dashmap = "6.2.1"
dupe = "0.9.1"
dupe_derive = "0.9.1"
educe = "0.7.4"
# NOTE (egglog): the two must be bumped together, or the experimental crate
# drags in a second copy of core egglog at its own major version
egglog = "3.0.0"
egglog-experimental = "3.0.0"
egraph-serialize = { version = "0.3.0", default-features = false, features = ["serde"] }
env_logger = "0.11"
eyre = "0.6.12"
fastcdc = "4.0.1"
figleter = "0.2.2"
fjall = { version = "3.1.7", default_features = false, features = [
    "lz4",
    "metrics",
] }
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false }
futures = "0.3.32"
glob = "0.3"
# NOTE (aseipp): version must stay in lockstep with jj-lib's gix requirement,
# or the whole gix crate stack gets duplicated in the build graph
gix = { version = "0.80.0", default-features = false, features = [
    "attributes",
    "blob-diff",
    "index",
    "max-performance-safe",
    "zlib-rs",
] }
hegeltest = "0.28.0"
hex = "0.4.3"
hmac = "0.12"
http = "1.4.2"
http-body-util = "0.1"
hyper = "1.10.1"
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "native-tokio",
] }
indexmap = { version = "2", features = ["serde"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
insta = "1.48.0"
iocraft = "0.8.4"
# NOTE (aseipp): default features enable `tls-ring`, so turn them off
iroh = { version = "1.0.3", default-features = false, features = [
    "metrics",
    "portmapper",
] }
jiff = "0.2.32"
landlock = "0.4.5"
linked-hash-map = "0.5.6"
log = "0.4"
md5 = "0.8"
memmap2 = "0.9.11"
notify-debouncer-mini = { version = "0.7.0", features = ["crossbeam-channel"] }
object_store = "0.14"
openssl = "0.10.81"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-resource-detectors = "0.11.0"
opentelemetry-appender-log = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"
parking_lot = "0.12.5"
percent-encoding = "2"
pollster = "1.0.1"
proc-macro2 = "1.0.106"
prost = "0.14.4"
prost-types = "0.14.4"
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"] }
quote = "1.0.46"
rand = "0.10.2"
ratatui = "0.30"
rayon = "1.12.0"
# NOTE (aseipp): no default features, ever: they pull in aws-lc-rs.
rustls = { version = "0.23.42", default-features = false, features = ["std"] }
# NOTE (aseipp): reqwest 0.13 flipped `default-tls` to rustls (which pulls
# ring/aws-lc-rs). We build against BoringSSL, so disable default features and
# select `native-tls` explicitly; the rest mirrors reqwest's default set.
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "charset",
    "http2",
    "stream",
    "system-proxy",
] }
s3s = "0.14.1"
salsa = "0.28.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# NOTE (aseipp): sha1/sha2 stay on the digest-0.10 family: 0.11 removed the
# `compress` feature and generic_array, both used by cache-server hashing
sha1 = { version = "0.10", features = ["compress"] }
sha2 = { version = "0.10", features = ["compress"] }
# NOTE (aseipp): default features enable `aws`, which drags in object_store/aws
# -> reqwest/rustls -> ring. cache-server only uses the memory/local backends,
# so keep just `foyer` (the block cache) and let object_store default to `fs`.
slatedb = { version = "0.14.1", default-features = false, features = ["foyer"] }
syn = { version = "2.0.119", features = ["full"] }
tar = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.18"
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-health = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tokio = { version = "1.53", features = [
    "full",
    "tracing",
    "macros",
    "rt-multi-thread",
]}
tokio-openssl = "0.6.5"
# NOTE: default features enable `aws_lc_rs`, so turn them off
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "logging",
] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["compat"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4"] }
watchman_client = "0.9.0"
zeroize = "1.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = "0.13"

## Git repos come below

dial9-tokio-telemetry = { git = "https://github.com/dial9-rs/dial9-tokio-telemetry", rev = "bd7a50c6873173c6d052a839f00f7fc576316a13", features = ["cpu-profiling", "memory-profiling"] }

# NOTE (jj): adjust fixups.toml too
jj-lib = { git = "https://github.com/martinvonz/jj", rev = "0c24fce22b29732837a00acdb3d43c4a218ac1f1" }
jj-cli = { git = "https://github.com/martinvonz/jj", rev = "0c24fce22b29732837a00acdb3d43c4a218ac1f1" }

# NOTE (starlark): bump to stable when possible
starlark        = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }
starlark_derive = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }

[target.'cfg(unix)'.dependencies]

[target.'cfg(windows)'.dependencies]
