[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
publish = false
edition = "2021"

# Dummy target to keep Cargo happy
[[bin]]
name = "top"
path = "top.rs"

[dependencies]
anyhow = "1.0.104"
arbitrary = "1.1"
argh = "0.1.19"
# The key derivation for short join codes (src/gonzo/mesh); only the raw
# hash is used, not the password-hash string format.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
ariadne = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1"
# NOTE (base64): reqwest, hyper-util and clubcard-crlite are on 0.23, so it is
# in the graph already; tonic, gix-transport, attohttpc, portmapper, termwiz,
# tokio-websockets and hdrhistogram still hold a 0.22 copy beside it.
base64 = "0.23.1"
# NOTE (bincode): 1.x is unmaintained, but it is the format of CRLite's
# filters (via clubcard-crlite) and of the intermediates file upstream's
# query tool keeps beside them, which src/crates/crlite reads and writes.
bincode = "1.3.3"
bitflags = "2.13.2"
blake3 = "1.8.7"
brotli = "9.0"
buck-resources = "1"
bytes = "1.12.1"
capnp = "0.27.3"
capnpc = "0.27.0"
capnp-futures = "0.27.0"
capnp-rpc = "0.27.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chumsky = { version = "0.13.0", features = ["either", "memoization", "pratt", "regex", "serde", "stacker"] }
# CRLite filters (src/crates/crlite). clubcard-crlite's default features
# read the bincode-encoded (V3) filters Remote Settings publishes; `builder`
# on both is for building filters in tests.
clubcard = { version = "0.3.4", features = ["builder"] }
clubcard-crlite = { version = "0.6.2", features = ["builder"] }
# NOTE (clap): `env` is used by our own `#[arg(env = ...)]` attributes. It used
# to arrive for free through jj-cli, which stopped enabling it in 0.45.
clap = { version = "4.6", features = ["derive", "env"] }
console-subscriber = "0.5.0"
cedar-policy = "4.14.1"
# NOTE (crc-fast): CRC-32C (iSCSI) with SIMD, for src/crates/blob-pack's
# per-entry checksums. s3s already locks it, so this adds no new crate.
crc-fast = "1.10.0"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
dashmap = "6.2.1"
dupe = "0.9.1"
dupe_derive = "0.9.1"
educe = "0.8.2"
# NOTE (egglog): the two must be bumped together, or the experimental crate
# drags in a second copy of core egglog at its own major version
egglog = "3.0.0"
egglog-experimental = "3.0.0"
egraph-serialize = { version = "0.3.0", default-features = false, features = ["serde"] }
env_logger = "0.11"
eyre = "0.6.14"
# NOTE (fastcdc): stay on 4. 5.0 requires even min/avg/max sizes, and the
# fastcdc2020 conformance vectors in storage/testdata are published at
# MaxSize 65535 by both reference implementations — regenerating them at an
# even size would leave the fixture checking our own output against itself.
# Our production sizes are all even, and 5.0's tail-hash fix touches a field
# we never read, so the bump buys nothing here.
fastcdc = "4.0.1"
figleter = "0.2.2"
fjall = { version = "3.1.13", default_features = false, features = [
    "lz4",
    "metrics",
] }
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false }
futures = "0.3.34"
glob = "0.3"
# NOTE (aseipp): version and features must stay in lockstep with jj-lib's gix
# requirement, or the whole gix crate stack gets duplicated in the build graph.
# `zlib-rs` is gone as of gix 0.87; gix picks its own zlib backend now.
# `max-performance-safe` went in 0.90; jj-lib asks for `max-performance`.
gix = { version = "0.90.0", default-features = false, features = [
    "attributes",
    "blob-diff",
    "blocking-http-transport-reqwest-native-tls",
    "index",
    "max-performance",
    "sha1",
    "sha256",
    "worktree-mutation",
] }
# Pack indexing and object access for the cache-server's git fetcher, pinned
# to the versions gix (above) resolves so they stay one crate stack.
# `streaming-input` adds pack-stream indexing; it pulls in nothing new.
# gix-error is the error type gix-pack reports since 0.77.
gix-error = "=0.5.2"
gix-hash = "=0.28.1"
gix-object = { version = "=0.66.1", default-features = false, features = ["sha1"] }
gix-pack = { version = "=0.77.0", default-features = false, features = [
    "pack-cache-lru-dynamic",
    "sha1",
    "streaming-input",
] }
gix-zlib = "=0.4.0"
# Progress sinks for gix-pack (`progress::Discard`); they moved here from
# gix-features, which gix stopped using in 0.90.
gix-utils = { version = "=0.5.2", features = ["progress"] }
# Text shaping for quad's GUI (tilde/aseipp/quad), HarfBuzz's port to Rust;
# it reads fonts with read-fonts, as skrifa does.
harfrust = "0.15.0"
hegeltest = { version = "0.52.0", features = ["static-engine"] }
# Must match hegeltest's exact engine dependency.
hegeltest-c = "=0.50.0"
hex = "0.4.3"
hmac = "0.13"
http = "1.5.0"
http-body-util = "0.1"
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "http1",
    "native-tokio",
] }
ignore = "0.4.33"
indexmap = { version = "2", features = ["serde"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
insta = "1.49.0"
iocraft = "0.9.4"
# NOTE (aseipp): default features enable `tls-ring`, so turn them off
iroh = { version = "1.4.1", default-features = false, features = [
    "metrics",
    "portmapper",
] }
# Keep blob storage, but omit RPC: its default noq features enable tls-ring.
iroh-blobs = { version = "0.104.1", default-features = false, features = ["fs-store", "metrics"] }
iroh-gossip = "0.102.0"
# BitTorrent mainline DHT and mDNS address lookup, plus the DHT client both
# the lookup and depot's topic rendezvous use. None of these pull in a TLS stack.
iroh-mainline-address-lookup = "0.6.1"
iroh-mdns-address-lookup = "0.6.1"
iroh-tickets = "1.0.0"
jiff = "0.2.41"
landlock = "0.4.7"
libc = "0.2.191"
linked-hash-map = "0.5.6"
log = "0.4"
md5 = "0.8"
memmap2 = "0.9.12"
n0-mainline = "0.7.1"
notify-debouncer-mini = { version = "0.7.0", features = ["crossbeam-channel"] }
num-bigint = "0.4.8"
object_store = "0.14"
openssl = "0.10.82"
# NOTE (opentelemetry): move the core crates, opentelemetry-resource-detectors
# and tracing-opentelemetry together; each edge release requires exactly one
# opentelemetry minor, so a partial bump puts two copies in the graph.
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
opentelemetry-resource-detectors = "0.13.0"
opentelemetry-appender-log = "0.33.1"
opentelemetry-semantic-conventions = "0.33.1"
tracing-opentelemetry = "0.34.0"
parking_lot = "0.12.5"
percent-encoding = "2"
# PNG images for quad's GUI (tilde/aseipp/quad), decoded to draw them.
png = "0.18"
pollster = "1.0.1"
proc-macro2 = "1.0.107"
prost = "0.14.4"
prost-types = "0.14.4"
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }
quote = "1.0.47"
# cache-server's in-process cache of stored blobs; no default features, so
# neither ahash nor parking_lot (it hashes with its own digest hasher).
quick_cache = { version = "0.6", default-features = false }
rand = "0.10.3"
ratatui = "0.30"
rayon = "1.12.0"
regex = "1.13.1"
# NOTE (quad): a line ends at "\n" alone, as quad's text has it: no
# unicode_lines or cr_lines, which also end lines at CR, CRLF, NEL and the
# Unicode separators.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
regex-cursor = { version = "0.1.5", features = ["ropey"] }
# NOTE (aseipp): no default features, ever: they pull in aws-lc-rs.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
# NOTE (aseipp): reqwest 0.13 flipped `default-tls` to rustls (which pulls
# ring/aws-lc-rs). We build against BoringSSL, so disable default features and
# select `native-tls` explicitly; the rest mirrors reqwest's default set.
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "charset",
    "http2",
    "stream",
    "system-proxy",
] }
# NOTE (rustls-webpki): rustls-transport builds verified paths itself, to
# check them against CRLite and OneCRL. No crypto backend features (ring,
# aws-lc-rs): signatures are verified with the rustls provider's algorithms.
# Keep in step with the version rustls resolves.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
# chaos3 needs only s3s's core protocol adapter, not its optional TLS backends.
s3s = { version = "0.17.0", default-features = false }
salsa = "0.28.5"
serde = { version = "1.0", features = ["derive"] }
# NOTE (fozzie): float_roundtrip parses floats exactly, so a value written
# back parses to the same value. Fozzie's json-fuzz example checks that.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# NOTE (aseipp): sha1, sha2, and hmac move together (hmac 0.13 needs the
# digest 0.11 family). sha2 0.11 picks the ARMv8 SHA-2 instructions at run
# time by default, which 0.10 only did behind its `asm` feature (and the
# sha2-asm C build that comes with it); the raw compression function that
# cache-server's sha256tree needs is `sha2::block_api::compress256`.
sha1 = "0.11"
sha2 = "0.11"
# Glyph outlines and metrics for quad's GUI, which draws the outlines as
# curves on the GPU (Slug).
skrifa = "0.49.0"
# NOTE (aseipp): default features enable `aws`, which drags in object_store/aws
# -> reqwest/rustls -> ring. cache-server only uses the memory/local backends,
# so keep just `foyer` (the block cache) and let object_store default to `fs`.
slatedb = { version = "0.18.1", default-features = false, features = ["foyer"] }
# The `MetricsRecorder` trait SlateDB reports its metrics through (the
# cache-server exports them over OTLP); slatedb does not re-export it.
slatedb-common = "=0.18.1"
# NOTE (syn): 3.0 is out and already in the graph for the few crates that ask
# for it, but nearly every proc macro still builds against 2.x. Moving this
# entry would not remove the 2.x copy, so there is nothing to gain yet.
syn = { version = "2.0.119", features = ["full"] }
tar = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
tonic = "0.14.9"
tonic-build = "0.14.9"
tonic-health = "0.14.9"
tonic-prost-build = "0.14.9"
tonic-prost = "0.14.9"
tonic-reflection = "0.14.9"
tokio = { version = "1.54", features = [
    "full",
    "tracing",
    "macros",
    "rt-multi-thread",
]}
tokio-openssl = "0.6.5"
# NOTE: default features enable `aws_lc_rs`, so turn them off
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "logging",
] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["compat"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.3"
uuid = { version = "1.29.1", features = ["v4"] }
# NOTE (x509-parser): never `verify` or `verify-aws`, which bring in ring and
# aws-lc-rs; verify signatures with BoringSSL (the `openssl` crate) instead.
x509-parser = "0.18.1"
wasm-encoder = { version = "0.262.0", features = ["wasmparser"] }
wasm-smith = { version = "0.262.0", features = ["wasmparser"] }
wasmparser = "0.262.0"
wait4 = "0.2.0"
wasmprinter = "0.262.0"
# wat is versioned 1.x, so "1.262.0" would let it (and wast) move ahead of the
# rest of wasm-tools and pull in a second wasm-encoder and wasmparser.
wat = "~1.262.0"
watchman_client = "0.9.0"
# NOTE (wit-bindgen): the generators behind wit-bindgen's CLI, which `witgen c`
# and `witgen rust` run in the build graph. 0.63 is the release on this
# wasm-tools (wit-parser 0.262); move them together, and leave wasm-tools at
# the wit-parser wit-bindgen asks for even when a newer one is out.
wit-bindgen-c = { version = "0.63.0", features = ["clap"] }
wit-bindgen-core = "0.63.0"
wit-bindgen-rust = { version = "0.63.0", features = ["clap"] }
wit-component = "0.262.0"
wit-parser = "0.262.0"
zeroize = "1.9.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# NOTE (zstd): 0.14.3 / zstd-safe 8.2 carry the fixes for RUSTSEC-2026-0391
# and RUSTSEC-2026-0395..0406, none of which reached 0.13 / zstd-safe 7.
# slatedb's foyer-storage still pins 0.13, so its copy stays alongside this
# one over the shared zstd-sys build; see rustExceptions in
# buck/osv.dev/model.go. Drop that copy once foyer moves to 0.14.
zstd = "0.14.3"

## Git repos come below

# NOTE (dial9): 0.5 replaced the `dial9-tokio-telemetry` crate with the `dial9`
# facade; the rev is the `dial9-v0.5.8` tag. Tokio integration is a feature now
# (`tokio`), and it is the only one that pulls a runtime in. `process-resource`
# was on by default on unix in 0.3 and is opt-in here, so name it to keep the
# rusage events cache-server traces already carried.
dial9 = { git = "https://github.com/dial9-rs/dial9-tokio-telemetry", rev = "79079191de100585f25ccb6986561faba0b48054", features = [
    "tokio",
    "cpu-profiling",
    "memory-profiling",
    "process-resource",
] }

# NOTE (jj): adjust fixups.toml too — `JJ_VERSION` there must match the rev.
# This rev is the `v0.47.1` tag.
jj-lib = { git = "https://github.com/martinvonz/jj", rev = "d16ee1fc88a72c54142241b079a34bbf3b033bc0" }
jj-cli = { git = "https://github.com/martinvonz/jj", rev = "d16ee1fc88a72c54142241b079a34bbf3b033bc0" }

# NOTE (starlark): 0.14.2 exists but neither form of it is usable yet. The
# crates.io release hard-pins `blake3 = "=1.8.2"`, two patch releases behind
# ours. The git tree relaxed that afterwards, but by then it had also moved
# allocative/dupe/display_container to `buck2.git?branch=main` — an unpinned
# branch — and raised thiserror, syn and stacker floors that pull tokio,
# futures, jiff and ~200 other crates along with them. Revisit when the next
# crates.io release drops the exact blake3 pin.
starlark        = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }
starlark_derive = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }

[target.'cfg(unix)'.dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
# The Wayland clipboard and primary selection for quad's GUI, which winit
# has no API for. NOTE: pinned to 0.7.2, whose smithay-client-toolkit (0.19)
# is winit 0.30's; 0.7.3 moves to 0.20, a second copy of it. It loads
# libwayland-client at run time ("dlopen", its default), as winit does.
smithay-clipboard = "=0.7.2"
# The system's fonts and their fallbacks for quad's GUI, from fontconfig,
# which it loads at run time ("fontconfig-dlopen"), as ash loads Vulkan.
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
# Screen readers for quad's GUI: AccessKit's tree of what a window shows,
# given to the desktop's accessibility bus (AT-SPI, over D-Bus: zbus, in
# Rust, so nothing links against libdbus) by its winit adapter. Its D-Bus
# connection runs on async-io's executor, on its own thread.
accesskit = "0.25.2"
accesskit_winit = { version = "0.34.2", default-features = false, features = [
  "accesskit_unix",
  "async-io",
  "rwh_06",
] }
# Vulkan for quad's GUI (tilde/aseipp/quad): ash loads libvulkan.so.1 at
# run time ("loaded"), so nothing links against the host's Vulkan loader.
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
# The NoGraphicsAPI examples' window (third-party//by-name/no/nographicsapi):
# winit's X11 and Wayland backends, which load libX11 and libwayland-client
# at run time, so no C headers or -devel packages are needed; and no
# client-side decorations, whose drawing pulls in fonts and a rasterizer.
winit = { version = "0.30.13", default-features = false, features = [
  "rwh_06",
  "wayland",
  "wayland-dlopen",
  "x11",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# quad's GUI (tilde/aseipp/quad) on macOS: winit's AppKit windows, with
# AccessKit's macOS adapter, and fontique's fonts from CoreText.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
accesskit = "0.25.2"
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06"] }
fontique = "0.12.0"
# ... drawn with Metal 4 into a CAMetalLayer. Each framework crate has a
# feature per header, all on by default: only the headers used are named.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFDictionary",
  "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
  "CGSession",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSError",
  "NSObject",
  "NSString",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "std",
  "MTL4ArgumentTable",
  "MTL4CommandAllocator",
  "MTL4CommandBuffer",
  "MTL4CommandEncoder",
  "MTL4CommandQueue",
  "MTL4CommitFeedback",
  "MTL4Compiler",
  "MTL4CompilerTask",
  "MTL4ComputeCommandEncoder",
  "MTL4FunctionDescriptor",
  "MTL4LibraryDescriptor",
  "MTL4LibraryFunctionDescriptor",
  "MTL4PipelineState",
  "MTL4RenderCommandEncoder",
  "MTL4RenderPass",
  "MTL4RenderPipeline",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandEncoder",
  "MTLDevice",
  "MTLDrawable",
  "MTLEvent",
  "MTLGPUAddress",
  "MTLLibrary",
  "MTLPipeline",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResidencySet",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-metal",
] }

[target.'cfg(windows)'.dependencies]
# quad's GUI (tilde/aseipp/quad) on Windows: winit's Win32 windows, with
# AccessKit's UI Automation adapter, fontique's fonts from DirectWrite, and
# Vulkan through ash, which loads vulkan-1.dll at run time ("loaded").
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
accesskit = "0.25.2"
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06"] }
fontique = "0.12.0"
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
# The Win32 and COM APIs quad calls itself: the clipboard, WASAPI for voice,
# process times, whether the desktop is seen. The version accesskit_windows
# and fontique already use.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
