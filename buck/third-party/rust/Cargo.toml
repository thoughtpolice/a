[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
publish = false
edition = "2021"

# Dummy target to keep Cargo happy
[[bin]]
name = "top"
path = "top.rs"

[dependencies]
anyhow = "1.0.104"
arbitrary = "1.1"
argh = "0.1.19"
ariadne = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1"
# NOTE (base64): stay on 0.22 until the ecosystem moves. hyper-util, reqwest,
# tonic, attohttpc, portmapper, termwiz and tokio-websockets all still pin
# 0.22, so bumping this crate only adds a third copy to the graph.
base64 = "0.22.1"
bitflags = "2.13.2"
blake3 = "1.8.7"
brotli = "9.0"
buck-resources = "1"
bytes = "1.12.1"
capnp = "0.27.2"
capnpc = "0.27.0"
capnp-futures = "0.27.0"
capnp-rpc = "0.27.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chumsky = { version = "0.13.0", features = ["either", "memoization", "pratt", "regex", "serde", "stacker"] }
# NOTE (clap): `env` is used by our own `#[arg(env = ...)]` attributes. It used
# to arrive for free through jj-cli, which stopped enabling it in 0.45.
clap = { version = "4.6", features = ["derive", "env"] }
console-subscriber = "0.5.0"
cedar-policy = "4.13.0"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
dashmap = "6.2.1"
dupe = "0.9.1"
dupe_derive = "0.9.1"
educe = "0.8.1"
# NOTE (egglog): the two must be bumped together, or the experimental crate
# drags in a second copy of core egglog at its own major version
egglog = "3.0.0"
egglog-experimental = "3.0.0"
egraph-serialize = { version = "0.3.0", default-features = false, features = ["serde"] }
env_logger = "0.11"
eyre = "0.6.14"
# NOTE (fastcdc): stay on 4. 5.0 requires even min/avg/max sizes, and the
# fastcdc2020 conformance vectors in storage/testdata are published at
# MaxSize 65535 by both reference implementations — regenerating them at an
# even size would leave the fixture checking our own output against itself.
# Our production sizes are all even, and 5.0's tail-hash fix touches a field
# we never read, so the bump buys nothing here.
fastcdc = "4.0.1"
figleter = "0.2.2"
fjall = { version = "3.1.10", default_features = false, features = [
    "lz4",
    "metrics",
] }
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false }
futures = "0.3.34"
glob = "0.3"
# NOTE (aseipp): version and features must stay in lockstep with jj-lib's gix
# requirement, or the whole gix crate stack gets duplicated in the build graph.
# `zlib-rs` is gone as of gix 0.87; gix picks its own zlib backend now.
gix = { version = "0.87.1", default-features = false, features = [
    "attributes",
    "blob-diff",
    "index",
    "max-performance-safe",
    "sha1",
    "sha256",
] }
hegeltest = { version = "0.46.1", features = ["static-engine"] }
# Must match hegeltest's exact engine dependency.
hegeltest-c = "=0.43.1"
hex = "0.4.3"
hmac = "0.12"
http = "1.5.0"
http-body-util = "0.1"
hyper = "1.11.1"
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "http1",
    "native-tokio",
] }
indexmap = { version = "2", features = ["serde"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
insta = "1.48.0"
iocraft = "0.9.1"
# NOTE (aseipp): default features enable `tls-ring`, so turn them off
iroh = { version = "1.2.0", default-features = false, features = [
    "metrics",
    "portmapper",
] }
jiff = "0.2.37"
landlock = "0.4.7"
libc = "0.2.189"
linked-hash-map = "0.5.6"
log = "0.4"
md5 = "0.8"
memmap2 = "0.9.11"
notify-debouncer-mini = { version = "0.7.0", features = ["crossbeam-channel"] }
object_store = "0.14"
openssl = "0.10.81"
# NOTE (opentelemetry): the core stays on 0.32 until the edges catch up. 0.33
# is out, but opentelemetry-resource-detectors 0.12 and tracing-opentelemetry
# 0.33 — both the newest releases — still require opentelemetry ^0.32, so
# moving the core would put two opentelemetry majors in the graph.
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-resource-detectors = "0.12.0"
opentelemetry-appender-log = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"
parking_lot = "0.12.5"
percent-encoding = "2"
pollster = "1.0.1"
proc-macro2 = "1.0.107"
prost = "0.14.4"
prost-types = "0.14.4"
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }
quote = "1.0.47"
rand = "0.10.3"
ratatui = "0.30"
rayon = "1.12.0"
# NOTE (aseipp): no default features, ever: they pull in aws-lc-rs.
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
# NOTE (aseipp): reqwest 0.13 flipped `default-tls` to rustls (which pulls
# ring/aws-lc-rs). We build against BoringSSL, so disable default features and
# select `native-tls` explicitly; the rest mirrors reqwest's default set.
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "charset",
    "http2",
    "stream",
    "system-proxy",
] }
# mems3 needs only s3s's core protocol adapter, not its optional TLS backends.
s3s = { version = "0.16.1", default-features = false }
salsa = "0.28.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# NOTE (aseipp): sha1/sha2 stay on the digest-0.10 family: 0.11 removed the
# `compress` feature and generic_array, both used by cache-server hashing.
# hmac 0.13 requires digest 0.11 too, so it is pinned by the same constraint
# and all three have to move together when they move.
sha1 = { version = "0.10", features = ["compress"] }
sha2 = { version = "0.10", features = ["compress"] }
# NOTE (aseipp): default features enable `aws`, which drags in object_store/aws
# -> reqwest/rustls -> ring. cache-server only uses the memory/local backends,
# so keep just `foyer` (the block cache) and let object_store default to `fs`.
slatedb = { version = "0.16.0", default-features = false, features = ["foyer"] }
# NOTE (syn): 3.0 is out and already in the graph for the few crates that ask
# for it, but nearly every proc macro still builds against 2.x. Moving this
# entry would not remove the 2.x copy, so there is nothing to gain yet.
syn = { version = "2.0.119", features = ["full"] }
tar = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.20"
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-health = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tokio = { version = "1.53", features = [
    "full",
    "tracing",
    "macros",
    "rt-multi-thread",
]}
tokio-openssl = "0.6.5"
# NOTE: default features enable `aws_lc_rs`, so turn them off
tokio-rustls = { version = "0.26.5", default-features = false, features = [
    "logging",
] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["compat"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }
wasm-encoder = { version = "0.259.0", features = ["wasmparser"] }
wasm-smith = { version = "0.259.0", features = ["wasmparser"] }
wasmparser = "0.259.0"
wasmprinter = "0.259.0"
wat = "1.259.0"
watchman_client = "0.9.0"
wit-component = "0.259.0"
wit-parser = "0.259.0"
zeroize = "1.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
# NOTE (zstd): stay on 0.13 while slatedb's foyer-storage pins it. 0.14 brings
# its own zstd-safe 8, so the bump buys a second Rust wrapper over the one
# zstd-sys build and nothing else.
zstd = "0.13"

## Git repos come below

# NOTE (dial9): 0.5 replaced the `dial9-tokio-telemetry` crate with the `dial9`
# facade; the rev is the `dial9-v0.5.1` tag. Tokio integration is a feature now
# (`tokio`), and it is the only one that pulls a runtime in. `process-resource`
# was on by default on unix in 0.3 and is opt-in here, so name it to keep the
# rusage events cache-server traces already carried.
dial9 = { git = "https://github.com/dial9-rs/dial9-tokio-telemetry", rev = "5badd12f1b61beb5508a5a8f3965384ba3d87527", features = [
    "tokio",
    "cpu-profiling",
    "memory-profiling",
    "process-resource",
] }

# NOTE (jj): adjust fixups.toml too — `JJ_VERSION` there must match the rev.
# This rev is the `v0.45.1` tag.
jj-lib = { git = "https://github.com/martinvonz/jj", rev = "7c41cdeb16b6b321c64e789a966b6adf723816a5" }
jj-cli = { git = "https://github.com/martinvonz/jj", rev = "7c41cdeb16b6b321c64e789a966b6adf723816a5" }

# NOTE (starlark): 0.14.2 exists but neither form of it is usable yet. The
# crates.io release hard-pins `blake3 = "=1.8.2"`, two patch releases behind
# ours. The git tree relaxed that afterwards, but by then it had also moved
# allocative/dupe/display_container to `buck2.git?branch=main` — an unpinned
# branch — and raised thiserror, syn and stacker floors that pull tokio,
# futures, jiff and ~200 other crates along with them. Revisit when the next
# crates.io release drops the exact blake3 pin.
starlark        = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }
starlark_derive = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }

[target.'cfg(unix)'.dependencies]

[target.'cfg(windows)'.dependencies]
