[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
publish = false
edition = "2021"

# Dummy target to keep Cargo happy
[[bin]]
name = "top"
path = "top.rs"

[dependencies]
anyhow = "1.0.97"
argh = "0.1.13"
ariadne = "0.5.1"
async-stream = "0.3.6"
async-trait = "0.1"
base64 = "0.22.1"
blake3 = "1.8.2"
brotli = "8.0"
buck-resources = "1"
bytes = "1.11.0"
capnp = "0.25.0"
capnpc = "0.25.0"
capnp-futures = "0.25.0"
capnp-rpc = "0.25.0"
chumsky = { version = "0.10.1", features = ["either", "lexical-numbers", "memoization", "pratt", "regex", "serde", "stacker"] }
clap = { version = "4.5.35", features = ["derive"] }
console-subscriber = "0.4.1"
cedar-policy = "4.8.2"
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
dupe = "0.9.1"
dupe_derive = "0.9.1"
educe = "0.6.0"
env_logger = "0.10"
eyre = "0.6.12"
figleter = "0.2.2"
fjall = { version = "3.0.1", default_features = false, features = [
    "lz4",
    "metrics",
] }
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false }
futures = "0.3.31"
gix = { version = "0.72.1", default-features = false, features = [
    "attributes",
    "blob-diff",
    "index",
    "max-performance-safe",
    "zlib-rs",
] }
hex = "0.4.3"
hmac = "0.12"
http = "1.3.1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
insta = "1.42.2"
iocraft = "0.7.10"
landlock = "0.4.4"
linked-hash-map = "0.5.6"
log = "0.4"
md5 = "0.7"
notify-debouncer-mini = { version = "0.6.0", features = ["crossbeam-channel"] }
openssl = "0.10.73"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
opentelemetry-resource-detectors = "0.10.0"
opentelemetry-appender-log = "0.31.0"
opentelemetry-semantic-conventions = "0.31.0"
tracing-opentelemetry = "0.32.0"
parking_lot = "0.12.5"
proc-macro2 = "1.0.103"
prost = "0.14.1"
prost-types = "0.14.1"
quote = "1.0.42"
rand = "0.8.5"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
s3s = "0.12.0"
salsa = "0.22.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slatedb = "0.10.1"
syn = { version = "2.0.110", features = ["full"] }
tar = "0.4"
tempfile = "3.20.0"
thiserror = "2.0.12"
tower = { version = "0.5", features = ["util"] }
tuirealm = { version = "3.0.1", features = ["derive", "serialize", "crossterm"] }
tui-realm-stdlib = "3.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tonic-prost-build = "0.14.2"
tonic-prost = "0.14.2"
tokio-util = { version = "0.7.15", features = ["compat"] }
tokio-openssl = "0.6.5"
tokio-stream = "0.1.17"
tokio = { version = "1.45.1", features = [
    "full",
    "tracing",
    "macros",
    "rt-multi-thread",
]}
tonic = "0.14.2"
tonic-build = "0.14.2"
tonic-reflection = "0.14.2"
tonic-health = "0.14.2"
uuid = { version = "1.17.0", features = ["v4"] }
watchman_client = "0.9.0"
zstd = "0.13"

## Git repos come below

egglog = { git = "https://github.com/egraphs-good/egglog", rev = "24d914f41ac2edc0936a56d92bcd1da4a5382e0b" }

# NOTE (jj): adjust fixups.toml too
jj-lib = { git = "https://github.com/martinvonz/jj", rev = "b1503b4fe967d9e9db5ac113cb4a33644d16842c" }
jj-cli = { git = "https://github.com/martinvonz/jj", rev = "b1503b4fe967d9e9db5ac113cb4a33644d16842c" }

# NOTE (starlark): bump to stable when possible
starlark        = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }
starlark_derive = { git = "https://github.com/facebook/starlark-rust", rev = "469ff502b05594b9b1ec1818753f712996a79d38" }

[target.'cfg(unix)'.dependencies]

[target.'cfg(windows)'.dependencies]

[patch.crates-io]
# iocraft has an incompatible version of unicode-width in its constraints;
# see <https://github.com/facebook/sapling/commit/6c23118ed1431c17c4497ac6a4141bbbf71fbe56>
# which needs to be undone to remove and fix this
sapling-streampager = { git = "https://github.com/thoughtpolice/sapling", branch = "aseipp/push-zmytopuxxptn" }
