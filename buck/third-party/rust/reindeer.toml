vendor = false
precise_srcs = true
include_top_level = true
third_party_metadata = true

[buck]
file_name = "BUILD"

alias = "shims.alias"
filegroup = "shims.filegroup"
http_archive = "shims.http_archive"
git_fetch = "shims.git_fetch"

rust_library = "third_party_rust.rust_library"
rust_binary = "third_party_rust.rust_binary"
cxx_library = "third_party_rust.cxx_library"
prebuilt_cxx_library = "third_party_rust.prebuilt_cxx_library"
buildscript_genrule = "third_party_rust.buildscript_run"

buckfile_imports = """
# XXX: begin buckfile_imports stanza
# in particular, these shims use our own 'third_party_rust' wrapper
# so we can enforce behaviors on them

load("@root//buck/shims:shims.bzl", "shims")
load("@root//buck/shims:third_party_rust.bzl", "third_party_rust")

# XXX: normal reindeer-generated code below
"""

# The platforms crates are configured for: reindeer's own defaults, which
# naming any replaces, and Windows on arm64, which they lack. Each name is
# one buck/third-party/rust/PACKAGE maps a configuration to.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"

[platform.windows-msvc-arm64]
target = "aarch64-pc-windows-msvc"

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"
