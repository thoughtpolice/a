# buildscript emits cfg_aliases (all false for our targets) but also invokes
# git via vergen, which is non-hermetic. The crate falls back gracefully via
# option_env!("VERGEN_GIT_SHA"), so don't run it.
buildscript.run = false
cargo_env = true
